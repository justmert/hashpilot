name: Weekly canary

# The 2026-09 audit found four external dependencies had moved or died while
# the repository sat untouched: the SDK repositories changed GitHub org, the
# HashScan verification server started redirecting to Sourcify, Sourcify shut
# off its v1 API, and the hosted vector database went offline. This job is the
# early warning for the next one of those.

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  canary:
    name: External dependencies still healthy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Documentation sources
        run: npm run check:sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Hedera read paths
        run: npm run smoke
        env:
          HEDERA_NETWORK: testnet

      - name: Sourcify verification API
        run: npm run check:sourcify

      - name: Hosted documentation index
        run: |
          set -e
          URL="${CHROMA_URL:-https://chroma-gateway-production.up.railway.app}"
          echo "Checking $URL"
          curl -fsS --max-time 20 "$URL/api/v2/heartbeat" > /dev/null
          echo "heartbeat ok"

      - name: Open an issue when something moved
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Canary failed: an external HashPilot dependency changed';
            const body = [
              'The weekly canary failed. Something HashPilot depends on has moved, changed shape, or gone down.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Checks in this job: documentation sources (GitHub repos and file paths),',
              'Hedera Mirror Node and JSON-RPC read paths, the Sourcify verification API,',
              'and the hosted documentation index.',
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'canary',
            });
            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['canary'],
              });
            }
